name: 'Send Notification Action'
description: 'Send notification via Email and/or Telegram'
inputs:
  channel:
    description: 'Notification channel: email, telegram, or both'
    required: false
    default: 'email'
  server_address:
    description: 'SMTP server address'
    required: false
  server_port:
    description: 'SMTP server port'
    required: false
  username:
    description: 'Email account username'
    required: false
  password:
    description: 'Email account password'
    required: false
  subject:
    description: 'Email subject'
    required: false
  body:
    description: 'Notification message body'
    required: true
  to:
    description: 'Recipient email address'
    required: false
  from:
    description: 'Sender email address'
    required: false
  html:
    description: 'Whether the email body is HTML'
    required: false
    default: 'false'
  telegram_chat_id:
    description: 'Telegram chat ID (required for telegram/both)'
    required: false
  telegram_parse_mode:
    description: 'Telegram parse mode: MarkdownV2, HTML, or leave empty for plain text'
    required: false
    default: 'MarkdownV2'
  telegram_disable_preview:
    description: 'Disable link preview in Telegram messages'
    required: false
    default: 'false'
  telegram_escape_markdown:
    description: 'Auto-escape MarkdownV2 special characters (use when body contains underscores, asterisks, etc.)'
    required: false
    default: 'false'
  telegram_reply_markup:
    description: 'JSON string for inline keyboard or custom reply markup'
    required: false
  telegram_template:
    description: 'Path to a JSON template file with {{VAR}} placeholders'
    required: false
  telegram_template_vars:
    description: 'JSON object of key-value pairs for template variable substitution'
    required: false
  telegram_method:
    description: 'Telegram method: sendMessage, sendPhoto, sendDocument, or sendMediaGroup'
    required: false
    default: 'sendMessage'
  telegram_photo:
    description: 'Photo URL or local file path (for sendPhoto)'
    required: false
  telegram_photo_caption:
    description: 'Caption for the photo'
    required: false
  telegram_document:
    description: 'Document URL or local file path (for sendDocument)'
    required: false
  telegram_document_caption:
    description: 'Caption for the document'
    required: false
  telegram_media:
    description: 'Comma-separated photo URLs for simple media group'
    required: false
  telegram_media_group:
    description: 'JSON array of {type, media, caption} objects for media group'
    required: false
runs:
  using: 'node20'
  main: 'dist/index.js'
